name: Advisory AI review
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  review:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      issues: write
    steps:
      # Execute reviewer code from the trusted base, never the PR checkout.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Review changed content
        run: npm run ai-review
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_PROVIDER: ${{ vars.AI_PROVIDER }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          AI_BASE_URL: ${{ vars.AI_BASE_URL }}
  unavailable:
    if: github.event.pull_request.head.repo.full_name != github.repository || github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - run: echo 'AI review skipped for untrusted/fork or Dependabot PR; deterministic checks still run.' >> "$GITHUB_STEP_SUMMARY"
